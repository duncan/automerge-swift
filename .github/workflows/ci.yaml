name: test
on:
  push:
    branches: [main]
  # Run for pull requests into any branch, so each PR in a stack of dependent
  # PRs is tested, not only the one based on main.
  pull_request:

jobs:
  automerge-dependencies:
    runs-on: macos-latest
    env:
      LOCAL_BUILD: true
      DEVELOPER_DIR: /Applications/Xcode.app
    concurrency:
      group: automerge-dependencies-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - name: Cache Automerge XCFramework and library
        id: cache-automerge
        uses: actions/cache@v5
        with:
          path: |
            automergeFFI.xcframework
            automergeFFI.xcframework.zip
            libuniffi_automerge.a
            libuniffi_automerge_threads.a
          # Everything the Rust build depends on, so any change to it rebuilds the library
          # instead of restoring one built from older sources.
          key: automerge-dependencies-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/build.rs', 'rust/uniffi-bindgen.rs', 'rust/src/**', 'scripts/build-xcframework.sh', 'scripts/compress-framework.sh', '.github/workflows/ci.yaml') }}
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup default 1.100.0
      - name: Build Automerge XCFramework and library
        if: steps.cache-automerge.outputs.cache-hit != 'true'
        run: ./scripts/build-xcframework.sh
      - name: Compress Automerge XCFramework
        if: steps.cache-automerge.outputs.cache-hit != 'true'
        run: ./scripts/compress-framework.sh
      - uses: actions/upload-artifact@v6
        if: steps.cache-automerge.outputs.cache-hit != 'true'
        with:
          name: libuniffi_automerge
          path: |
            libuniffi_automerge.a
            libuniffi_automerge_threads.a

  mac:
    runs-on: macos-latest
    needs: automerge-dependencies
    steps:
      - uses: actions/checkout@v5
      - name: Restore Automerge XCFramework and library
        uses: actions/cache/restore@v5
        with:
          path: |
            automergeFFI.xcframework
            automergeFFI.xcframework.zip
            libuniffi_automerge.a
            libuniffi_automerge_threads.a
          key: automerge-dependencies-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/build.rs', 'rust/uniffi-bindgen.rs', 'rust/src/**', 'scripts/build-xcframework.sh', 'scripts/compress-framework.sh', '.github/workflows/ci.yaml') }}
      - name: Get swift version
        run: swift --version
      - name: Swift tests
        run: |
          export LOCAL_BUILD=true
          swift test

  wasm:
    # ubuntu-latest moved to 26.04, which setup-swift can't install Swift on yet.
    runs-on: ubuntu-24.04
    needs: automerge-dependencies
    steps:
      - uses: actions/checkout@v5
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Restore Automerge XCFramework and library
        uses: actions/cache/restore@v5
        with:
          path: |
            automergeFFI.xcframework
            automergeFFI.xcframework.zip
            libuniffi_automerge.a
            libuniffi_automerge_threads.a
          key: automerge-dependencies-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'rust/build.rs', 'rust/uniffi-bindgen.rs', 'rust/src/**', 'scripts/build-xcframework.sh', 'scripts/compress-framework.sh', '.github/workflows/ci.yaml') }}
      # setup-swift v3.0.0-beta.1 verifies the Swiftly download before importing Swift's
      # signing keys (swift-actions/setup-swift#798), so import them first. This keeps the
      # signature check; remove it once a setup-swift release includes the fix.
      - name: Import Swift signing keys
        run: |
          keys="$RUNNER_TEMP/swift-all-keys.asc"
          curl -fsSL --compressed --retry 3 -o "$keys" https://www.swift.org/keys/all-keys.asc
          # The file is sometimes served gzip-compressed; gzip -cdf passes plain text through unchanged.
          if ! gzip -cdf "$keys" | gpg --import -; then
            echo "::error::Could not import Swift's signing keys. Downloaded $(wc -c < "$keys") bytes starting with:"
            head -c 256 "$keys" | od -c | head -16
            exit 1
          fi
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.2"
      - name: Install Swift SDK for WebAssembly
        run: swift sdk install https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      - name: Build tests
        run: |
          swift build --swift-sdk swift-6.4.2-RELEASE_wasm --build-tests -Xlinker "`pwd`/libuniffi_automerge.a" -Xlinker -z -Xlinker stack-size=$((1024 * 1024))
          # Ask SwiftPM where it put the test binary, since its folder and name depend on the Swift release.
          bin="$(swift build --swift-sdk swift-6.4.2-RELEASE_wasm --show-bin-path)"
          # Swift 6.4's build system names it AutomergeTests-test-runner.wasm; earlier releases, AutomergePackageTests.xctest.
          for name in AutomergeTests-test-runner.wasm AutomergePackageTests.xctest; do
            if [ -f "$bin/$name" ]; then
              echo "AUTOMERGE_TESTS=$bin/$name" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No test binary in $bin:"
          ls -la "$bin"
          exit 1
      - name: Run XCTest tests
        run: wasmtime run --wasm max-wasm-stack=$((1024 * 1024)) --dir . "$AUTOMERGE_TESTS"
      # Run directly, the test binary only runs XCTest; Swift Testing needs to be asked for.
      # Bundle.module looks for the test resource bundle beside Bundle.main, which is the
      # guest's working directory, so the tests run from the test binary's folder.
      - name: Run Swift Testing tests
        run: |
          cd "$(dirname "$AUTOMERGE_TESTS")"
          wasmtime run --wasm max-wasm-stack=$((1024 * 1024)) --dir . "$AUTOMERGE_TESTS" --testing-library swift-testing

  rustfmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.100.0
      - name: Clippy
        run: ./scripts/ci/rustfmt.sh

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy --no-self-update
          rustup default 1.100.0
      - name: Clippy
        run: ./scripts/ci/clippy.sh
      - name: Rust unit tests
        run: ./scripts/ci/rust-test.sh
